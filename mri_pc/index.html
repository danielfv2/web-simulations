<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador MRI CORREGIDO - Gradientes Bipolares</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fdfcf0; padding: 20px; color: #001f3f; display: flex; flex-direction: column; align-items: center; }
        h2 { text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 20px; font-style: italic; }
        .container { width: 100%; max-width: 900px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-top: 25px; background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .control-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        input[type=range] { width: 100%; cursor: pointer; }
        span.val { color: #00d1b2; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Evolución de Fase en el Tiempo (G<sub>enc</sub>)</h2>
    <p class="subtitle">Simulador interactivo de codificación de movimiento (VERSIÓN FÍSICA CORREGIDA)</p>
    
    <canvas id="phaseChart" width="800" height="400"></canvas>

    <div class="controls">
        <div class="control-group">
            <label>Velocidad Móvil 1 (v > 0): <span id="v1-val" class="val">1.0</span> cm/s</label>
            <input type="range" id="v1" min="0" max="3" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <label>Velocidad Móvil 2 (v < 0): <span id="v2-val" class="val">-1.0</span> cm/s</label>
            <input type="range" id="v2" min="-3" max="0" step="0.1" value="-1.0">
        </div>
        <div class="control-group">
            <label>Fuerza del Gradiente (G): <span id="g-val" class="val">2.0</span> G/cm</label>
            <input type="range" id="G" min="0.5" max="4" step="0.1" value="2.0">
        </div>
    </div>
</div>

<script>
    const ctx = document.getElementById('phaseChart').getContext('2d');
    
    // Función de generación de datos CORREGIDA para reajuste incompleto
    function generateData(v, G) {
        let data = [];
        const tau = 40; // Duración de los lóbulos del gradiente en unidades de tiempo
        const gap = 20; // Duración del gap
        
        for (let t = 0; t <= (2 * tau + gap); t++) {
            let phase = 0;
            
            // Ecuaciones ajustadas para representar visualmente la acumulación de fase física
            if (t <= tau) {
                // Lóbulo +G: Acumulación de fase de rampa cuadrática
                phase = G * (10 * t + 0.3 * v * t * t);
            } else if (t <= (tau + gap)) {
                // Gap: Fase constante (meseta)
                phase = G * (10 * tau + 0.3 * v * tau * tau);
            } else {
                // Lóbulo -G: Reajuste cuadrático incompleto
                let t2 = t - (tau + gap); // Tiempo local del segundo lóbulo
                let peakPhase = G * (10 * tau + 0.3 * v * tau * tau); // Fase al final del gap

                // Lógica de reajuste CORREGIDA:
                // La fase residual se debe a que el protón sigue moviéndose *más* en el campo del segundo gradiente.
                // Resta la fase estática (G*10*t2) Y añade una fase de movimiento extra que no se cancela.
                // Esta versión física correcta resulta en un "reajuste excesivo" o "reajuste insuficiente".
                phase = peakPhase - (G * (10 * t2 + 0.3 * v * t2 * t2));
            }
            data.push({x: t, y: phase});
        }
        return data;
    }

    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: Array.from({length: 101}, (_, i) => i),
            datasets: [
                {
                    label: 'Estático (Tejido Fijo)',
                    borderColor: '#000000',
                    borderWidth: 3,
                    data: generateData(0, 2),
                    pointRadius: 0,
                    tension: 0.4
                },
                {
                    label: 'Móvil 1 (v > 0) - Mismo lado',
                    borderColor: '#3b82f6',
                    borderWidth: 3,
                    borderDash: [5, 5],
                    data: generateData(1, 2),
                    pointRadius: 0,
                    tension: 0.4
                },
                {
                    label: 'Móvil 2 (v < 0) - Lado opuesto',
                    borderColor: '#ef4444',
                    borderWidth: 3,
                    borderDash: [5, 5],
                    data: generateData(-1, 2),
                    pointRadius: 0,
                    tension: 0.4
                }
            ]
        },
        options: {
            responsive: true,
            animation: false,
            interaction: { mode: 'index', intersect: false },
            scales: {
                x: {
                    title: { display: true, text: 'Tiempo (Secuencia del Gradiente Bipolar)', font: { size: 14, weight: 'bold' } },
                    ticks: { callback: function(val, index) {
                        if (index === 0) return 't0';
                        if (index === 40) return 'Fin +G';
                        if (index === 60) return 'Inicio -G';
                        if (index === 100) return 'Fin Secuencia';
                        return '';
                    }, maxRotation: 0 }
                },
                y: {
                    title: { display: true, text: 'Fase Φ (radianes)', font: { size: 14, weight: 'bold' } },
                    suggestedMin: -3000,
                    suggestedMax: 3000
                }
            },
            plugins: {
                legend: { position: 'bottom', labels: { font: { size: 14 } } }
            }
        }
    });

    function updateChart() {
        const v1 = parseFloat(document.getElementById('v1').value);
        const v2 = parseFloat(document.getElementById('v2').value);
        const g = parseFloat(document.getElementById('G').value);

        document.getElementById('v1-val').innerText = v1.toFixed(1);
        document.getElementById('v2-val').innerText = v2.toFixed(1);
        document.getElementById('g-val').innerText = g.toFixed(1);

        chart.data.datasets[0].data = generateData(0, g);
        chart.data.datasets[1].data = generateData(v1, g);
        chart.data.datasets[2].data = generateData(v2, g);
        chart.update();
    }

    document.getElementById('v1').addEventListener('input', updateChart);
    document.getElementById('v2').addEventListener('input', updateChart);
    document.getElementById('G').addEventListener('input', updateChart);
</script>
</body>
</html>
